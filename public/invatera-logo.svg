<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <!-- Line Gradient (Electric Violet to Cyber Cyan) -->
    <linearGradient id="invateraLineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Matching Fill Gradient (30% Soft Glassmorphism Fill) -->
    <linearGradient id="invateraFillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#4f46e5" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.32" />
    </linearGradient>

    <!-- Navy Base Gradient for Lower Frame -->
    <linearGradient id="invateraNavyFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b192c" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.14" />
    </linearGradient>
  </defs>

  <!-- Envelope Interior Base Fill -->
  <rect x="205" y="105" width="190" height="95" rx="10" fill="url(#invateraNavyFill)" />

  <!-- Lower Left Pillar (Navy Stroke & Fill) -->
  <path d="M 215 118 L 215 195 A 10 10 0 0 1 203 205 L 203 205 A 10 10 0 0 1 191 195 L 191 118 A 10 10 0 0 1 215 118 Z" fill="#0b192c" />

  <!-- Lower Base Frame (Navy Stroke) -->
  <path d="M 215 195 L 385 195 A 16 16 0 0 0 401 179 L 401 130 A 10 10 0 0 0 381 130 L 381 175 L 215 175 Z" fill="#0b192c" />

  <!-- Upper V-Fold & Arrow with Matching Fill and Stroke -->
  <g>
    <!-- Matching Fill Layer -->
    <path d="M 200 105 Q 200 90 216 90 L 315 90 Q 328 90 336 99 L 372 138 L 372 82 L 354 82 L 385 46 L 416 82 L 398 82 L 398 148 Q 398 158 388 165 L 350 193 Q 338 200 328 193 L 230 118 L 210 118 Q 200 118 200 105 Z" 
          fill="url(#invateraFillGrad)" />

    <!-- Matching Gradient Stroke Layer -->
    <path d="M 208 106 Q 208 94 222 94 L 310 94 Q 320 94 326 102 L 366 144 L 366 80 L 350 80 L 385 42 L 420 80 L 404 80 L 404 152 Q 404 164 392 171 L 348 202 Q 338 209 326 202 L 230 122" 
          fill="none" stroke="url(#invateraLineGrad)" stroke-width="17" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Diagonal Lower Fold Accent Line -->
    <path d="M 345 162 L 382 192" fill="none" stroke="url(#invateraLineGrad)" stroke-width="17" stroke-linecap="round" />
  </g>

  <!-- Typography -->
  <text x="300" y="275" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-weight="900" font-size="42" fill="#0b192c" letter-spacing="3">INVATERA</text>
  <text x="300" y="306" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-weight="700" font-size="14" fill="#0b192c" letter-spacing="6">DIGITAL INVITATIONS</text>
</svg>
